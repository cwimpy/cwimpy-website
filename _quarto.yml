project:
  type: website
  output-dir: _site
  resources:
    - "images/*.webp"
  # Explicit render list: courses are drafted until they launch, so we
  # exclude their content/, assignments/, schedule.qmd, resources.qmd.
  # Only the course landing pages ship. Remove the `!…` lines below when
  # the course is ready to go live.
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "teaching/courses/*/index.qmd"
    - "!teaching/courses/plsc-66003-fall2026/content/**"
    - "!teaching/courses/plsc-66003-fall2026/assignments/**"
    - "!teaching/courses/plsc-66003-fall2026/schedule.qmd"
    - "!teaching/courses/plsc-66003-fall2026/resources.qmd"

freeze: true

website:
  title: "Cameron Wimpy"
  site-url: "https://cwimpy.com"
  favicon: "favicon.ico"
  search:
    location: navbar
    type: overlay
  google-analytics: "G-TYNMV5ZKBT"
  back-to-top-navigation: true
  llms-txt: true
  twitter-card:
    image: "/images/og/index.png"
    card-style: summary_large_image
    creator: "@camwimpy"
  open-graph:
    title: "Dr. Cameron Wimpy"
    description: "Political Science Research & Teaching"
    image: "/images/og/index.png"
    image-width: 1200
    image-height: 630
  navbar:
    pinned: true
    right:
      - href: posts/index.qmd
        text: Posts
      - href: research.qmd
        text: Research
      - href: software.qmd
        text: Software
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
      - href: now.qmd
        text: Now
      - icon: rss
        href: posts/index.xml
        aria-label: RSS
  page-footer:
    border: false
    background: light
    left: |
      ::: {.site-footer}
      :::: {.footer-grid}

      ::: {.footer-col .footer-col-about}
      **Cameron Wimpy**
      <br>Associate Professor & Chair
      <br>Government, Law & Policy
      <br>Arkansas State University
      :::

      ::: {.footer-col}
      #### Site
      - [Research](/research.html)
      - [Teaching](/teaching.html)
      - [Software](/software.html)
      - [CV](/cv.html)
      - [Posts](/posts/)
      - [Now](/now.html)
      :::

      ::: {.footer-col}
      #### Connect
      - [Email](mailto:{{< var email >}})
      - [Schedule a meeting]({{< var scheduling >}})
      - [GitHub](https://github.com/cwimpy)
      - [Google Scholar]({{< var scholar >}})
      - [ORCID](https://orcid.org/{{< var orcid >}})
      - [X / Twitter]({{< var twitter >}})
      :::

      ::: {.footer-col}
      #### Also
      - [Institute for Rural Initiatives](https://www.astate.edu/a/iri/)
      - [Arkansas Biosciences Institute](https://www.astate.edu/abi)
      - [MIT Election Data + Science Lab](http://electionlab.mit.edu)
      - [Contact](/contact.html)
      - [RSS feed](/posts/index.xml)
      :::

      ::::
      :::

      ::: {.footer-bottom}
      <span>© 2026 Cameron Wimpy · Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org)</span>
      <span class="footer-social">
        <a href="/uploads/cv-wimpy.pdf" aria-label="CV">{{< ai cv >}}</a>
        <a href="mailto:{{< var email >}}" aria-label="Email">{{< fa envelope >}}</a>
        <a href="https://github.com/cwimpy" rel="me" aria-label="GitHub">{{< fa brands github >}}</a>
        <a href="{{< var scholar >}}" aria-label="Google Scholar">{{< ai google-scholar >}}</a>
        <a href="{{< var linkedin >}}" rel="me" aria-label="LinkedIn">{{< fa brands linkedin >}}</a>
        <a href="https://orcid.org/{{< var orcid >}}" rel="me" aria-label="ORCID">{{< ai orcid >}}</a>
        <a href="{{< var twitter >}}" rel="me" aria-label="X/Twitter">{{< fa brands x-twitter >}}</a>
        <a href="/posts/index.xml" aria-label="RSS">{{< fa rss >}}</a>
      </span>
      :::

format:
  html:
    theme:
      light: [journal, styles.scss]
      dark: [journal, custom-dark.scss]
    page-navigation: true
    anchor-sections: true
    smooth-scroll: true
    footnotes-hover: true
    code-copy: true
    lightbox: true
    include-in-header:
      - _includes/person-schema.html

filters:
  - fontawesome

bibliography: publications.bib