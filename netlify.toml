[build]
  command = """
    set -e
    echo "Installing Quarto..."
    cd /tmp
    wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.550/quarto-1.4.550-linux-amd64.tar.gz
    tar -xzf quarto-1.4.550-linux-amd64.tar.gz
    export PATH="/tmp/quarto-1.4.550/bin:$PATH"
    echo "Quarto installed, version:"
    quarto --version
    echo "Returning to build directory..."
    cd $OLDPWD
    echo "Current directory: $(pwd)"
    echo "Files in directory:"
    ls -la
    echo "Starting Quarto render..."
    quarto render --verbose
  """
  publish = "_site"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404