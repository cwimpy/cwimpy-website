[build]
  command = """
    # Download and install Quarto without sudo
    cd /tmp
    wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.550/quarto-1.4.550-linux-amd64.tar.gz
    tar -xzf quarto-1.4.550-linux-amd64.tar.gz
    export PATH="/tmp/quarto-1.4.550/bin:$PATH"
    cd $OLDPWD
    quarto render
  """
  publish = "_site"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404