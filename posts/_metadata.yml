# Metadata for all files in the posts/ directory
date-modified: last-modified
format:
  html:
    date-format: "MMM D, YYYY"
    reading-time: true
    # Adds class="post-page" to <body>; _components.scss uses it to set a
    # comfortable line length for long-form posts.
    body-classes: post-page

# Typst PDF config for posts that opt in (add to individual post YAML).
# `highlight-style: none` is required — the post-template.typ defines `raw`
# styling but not the syntax-highlighting tokens (NormalTok, FunctionTok,
# Skylighting, callout, horizontalrule). Until those helpers are added to
# the template, posts opting in to Typst should also wrap any callouts,
# block code, or `---` dividers in `::: {.content-visible when-format="html"}`.
# format:
#   typst:
#     pdf-engine: typst
#     date-format: "M/D/YYYY"
#     highlight-style: none
#     margin:
#       top: 1in
#       left: 1in
#       right: 1in
#       bottom: 1in
#     mainfont: "Minion Pro"
#     sansfont: "Myriad Pro"
#     template: "../templates/post-template.typ"

comments:
  giscus:
    repo: cwimpy/cwimpy-website
    repo-id: "R_kgDOO9_voQ"
    category: "General"
    category-id: "DIC_kwDOO9_voc4CrxCV"
    mapping: "pathname"
    reactions-enabled: true
    input-position: "bottom"
    # Follow the site's light/dark toggle instead of staying light
    theme:
      light: light
      dark: transparent_dark
    language: "en"