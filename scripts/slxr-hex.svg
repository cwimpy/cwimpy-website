<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
  <defs>
    <!-- Hex clip path (pointy-top) -->
    <clipPath id="hexClip">
      <polygon points="260,10 505,150 505,450 260,590 15,450 15,150"/>
    </clipPath>

    <!-- Matches rurality hex — sibling identity -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#143d28"/>
      <stop offset="100%" stop-color="#2d8a47"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="68%" r="48%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600;1,9..144,600;0,9..144,400;1,9..144,400;0,9..144,500..700;1,9..144,500..700&family=Inter:wght@600&display=swap');
      .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 600;
                  font-variation-settings: 'opsz' 144, 'SOFT' 60, 'WONK' 1;
                  font-style: italic; fill: #fdfcf8; }
      .tagline  { font-family: 'Inter', sans-serif; font-weight: 600;
                  font-size: 16px; letter-spacing: 0.28em;
                  text-transform: uppercase; fill: #d4e5da; }
      .version  { font-family: 'Inter', sans-serif; font-weight: 600;
                  font-size: 13px; letter-spacing: 0.18em; fill: #9ad9b3; }
    ]]></style>
  </defs>

  <g clip-path="url(#hexClip)">
    <rect width="520" height="600" fill="url(#bgGrad)"/>

    <!-- Whisper-faint contour lines (same grammar as the rurality hex) -->
    <g fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.12">
      <path d="M -60 120 Q 160 50 390 180 T 660 210"/>
      <path d="M -60 190 Q 170 130 390 260 T 660 290"/>
      <path d="M -60 270 Q 180 220 390 340 T 660 370"/>
      <path d="M -60 360 Q 200 320 390 430 T 660 460"/>
      <path d="M -60 450 Q 220 420 390 510 T 660 530"/>
    </g>

    <rect width="520" height="600" fill="url(#glow)"/>

    <!-- Three overlapping networks on a shared node set.
         Nodes: A(130,150) B(235,120) C(335,160) D(400,225) E(350,295)
                F(220,290) G(110,245) H(265,220)
         Network 1 (sage green)  = contiguity W
         Network 2 (amber)       = distance W
         Network 3 (cream)       = alliance/trade W
         Same nodes, different edges = variable-specific weights matrices. -->

    <!-- Network 1: contiguity (closed planar loop) -->
    <g stroke="#9ad9b3" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
      <line x1="130" y1="150" x2="235" y2="120"/>
      <line x1="235" y1="120" x2="335" y2="160"/>
      <line x1="335" y1="160" x2="265" y2="220"/>
      <line x1="265" y1="220" x2="220" y2="290"/>
      <line x1="220" y1="290" x2="110" y2="245"/>
      <line x1="110" y1="245" x2="130" y2="150"/>
    </g>

    <!-- Network 2: distance / gravity W — dashed for legibility -->
    <g stroke="#d9a44a" stroke-width="2.2" stroke-linecap="round"
       stroke-dasharray="5 4" opacity="0.9">
      <line x1="130" y1="150" x2="400" y2="225"/>
      <line x1="235" y1="120" x2="350" y2="295"/>
      <line x1="335" y1="160" x2="220" y2="290"/>
      <line x1="110" y1="245" x2="400" y2="225"/>
    </g>

    <!-- Network 3: alliance / trade W — sparse long edges, dotted -->
    <g stroke="#f0ead6" stroke-width="1.8" stroke-linecap="round"
       stroke-dasharray="1.6 5" opacity="0.78">
      <line x1="130" y1="150" x2="350" y2="295"/>
      <line x1="235" y1="120" x2="110" y2="245"/>
      <line x1="335" y1="160" x2="400" y2="225"/>
    </g>

    <!-- Nodes (drawn last so all lines pass beneath them) -->
    <g>
      <!-- Shadow halo -->
      <g fill="#143d28" opacity="0.55">
        <circle cx="130" cy="150" r="11"/>
        <circle cx="235" cy="120" r="11"/>
        <circle cx="335" cy="160" r="11"/>
        <circle cx="400" cy="225" r="11"/>
        <circle cx="350" cy="295" r="11"/>
        <circle cx="220" cy="290" r="11"/>
        <circle cx="110" cy="245" r="11"/>
        <circle cx="265" cy="220" r="11"/>
      </g>
      <!-- Cream fill -->
      <g fill="#f0ead6" stroke="#1a3a2a" stroke-width="2">
        <circle cx="130" cy="150" r="8"/>
        <circle cx="235" cy="120" r="8"/>
        <circle cx="335" cy="160" r="8"/>
        <circle cx="400" cy="225" r="8"/>
        <circle cx="350" cy="295" r="8"/>
        <circle cx="220" cy="290" r="8"/>
        <circle cx="110" cy="245" r="8"/>
        <!-- Central node slightly larger — optional focal point -->
        <circle cx="265" cy="220" r="10"/>
      </g>
    </g>

    <!-- Wordmark: matches rurality hex styling -->
    <text x="260" y="430" text-anchor="middle" class="wordmark" font-size="110">slxr</text>

    <!-- Tagline — names the core idea without leaning on acronym knowledge -->
    <text x="260" y="472" text-anchor="middle" class="tagline">spatial · x · lag</text>

    <!-- Slug / attribution near bottom point -->
    <text x="260" y="545" text-anchor="middle" class="version">cwimpy / slxr</text>
  </g>

  <!-- Hex stroke -->
  <polygon points="260,10 505,150 505,450 260,590 15,450 15,150"
           fill="none" stroke="#9ad9b3" stroke-width="4" stroke-linejoin="round"/>
</svg>
