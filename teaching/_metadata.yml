# Metadata for all files in the teaching/ directory
date-modified: last-modified
format:
  html: 
    date-format: "M/D/YYYY"
  typst:
    pdf-engine: typst
    date-format: "M/D/YYYY"
    margin:
      top: 1in
      left: 1in
      right: 1in
      bottom: 1in
    mainfont: "Minion Pro"
    sansfont: "Myriad Pro"
    template: "../templates/teaching-template.typ"